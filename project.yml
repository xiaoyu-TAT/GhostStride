name: GhostStride
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  GhostStride:
    type: application
    platform: iOS
    sources:
      - path: GhostStride
        excludes: [Resources/Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GhostStride
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: GhostStride/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: [GhostStrideTests]
  GhostStrideTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GhostStrideTests]
    dependencies:
      - target: GhostStride
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GhostStrideTests
        GENERATE_INFOPLIST_FILE: YES
